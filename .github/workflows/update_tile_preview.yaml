name: Update Tile Preview
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  update-tile-preview:
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: -Dorg.gradle.workers.max=4 -Dorg.gradle.jvmargs=-Xmx13g
      PREVIEW_BRANCH: tile-preview/${{ github.ref_name }}
      BASE_BRANCH: ${{ github.ref_name }}
      APPLICATION_ID: net.matsudamper.watchface
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - name: Setup Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: 'temurin'
          java-version: '26.0.2+10'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: build
        run: ./gradlew assembleDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick
      - name: Capture preview
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: android-wear
          arch: x86_64
          profile: wearos_large_round
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: ./.github/scripts/capture_tile_preview.sh
      - name: Resize preview
        run: |
          convert preview_raw.png -resize 384x384 -strip app/src/main/res/drawable/tile_preview.png
          cp app/src/main/res/drawable/tile_preview.png app/src/main/res/drawable-round/tile_preview.png
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tile-preview
          path: app/src/main/res/drawable/tile_preview.png
      - name: Create pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- app/src/main/res; then
            echo "プレビュー画像に差分がないため終了"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -C "$PREVIEW_BRANCH"
          git add app/src/main/res/drawable/tile_preview.png app/src/main/res/drawable-round/tile_preview.png
          git commit -m "tile_preview.png を更新"
          git push --force origin "$PREVIEW_BRANCH"
          if [ -z "$(gh pr list --head "$PREVIEW_BRANCH" --base "$BASE_BRANCH" --state open --json number --jq '.[]')" ]; then
            gh pr create \
              --base "$BASE_BRANCH" \
              --head "$PREVIEW_BRANCH" \
              --title "tile_preview.png を更新 ($BASE_BRANCH)" \
              --body "Update Tile Preview workflow で $BASE_BRANCH のウォッチフェイスを撮影して更新しました。"
          fi
