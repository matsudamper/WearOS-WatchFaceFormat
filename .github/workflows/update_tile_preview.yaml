name: Update Tile Preview
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  update-tile-preview:
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: -Dorg.gradle.workers.max=4 -Dorg.gradle.jvmargs=-Xmx13g
      PREVIEW_BRANCH: tile-preview/${{ github.ref_name }}
      BASE_BRANCH: ${{ github.ref_name }}
      APPLICATION_ID: net.matsudamper.watchface
      SYSTEM_IMAGE: system-images;android-36;android-wear-signed;x86_64
      ANDROID_AVD_HOME: ${{ github.workspace }}/.avd
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - name: Setup Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: 'temurin'
          java-version: '26.0.2+10'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: build
        run: ./gradlew assembleDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick
      - name: Install emulator
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install emulator platform-tools "$SYSTEM_IMAGE" > /dev/null
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --force -n wear -k "$SYSTEM_IMAGE" -d wearos_large_round
          "$ANDROID_HOME/emulator/emulator" -list-avds
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
      - name: Start emulator
        run: |
          nohup emulator -avd wear -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim > emulator.log 2>&1 &
          echo "EMULATOR_PID=$!" >> "$GITHUB_ENV"
      - name: Wait for boot
        timeout-minutes: 10
        run: |
          until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; do
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then
              cat emulator.log
              exit 1
            fi
            sleep 5
          done
      - name: Install watch face
        run: adb install -r app/build/outputs/apk/debug/app-debug.apk
      - name: Start synthetic health data
        run: |
          # 既定のコンプリケーションは歩数のため、エミュレータで歩数データが出るよう Health Services の合成データで歩行させる
          adb shell am broadcast -a whs.USE_SYNTHETIC_PROVIDERS com.google.android.wearable.healthservices
          adb shell am broadcast -a whs.synthetic.user.START_WALKING com.google.android.wearable.healthservices
      - name: Set watch face
        run: |
          # 充電中だと充電画面がウォッチフェイスに重なるため、未接続扱いにする
          adb shell dumpsys battery unplug
          # 待機中に画面がスリープするとアンビエント表示で撮影されるため、常時点灯にする
          adb shell svc power stayon true
          adb shell settings put system screen_off_timeout 1800000
          adb shell am broadcast \
            -a com.google.android.wearable.app.DEBUG_SURFACE \
            --es operation set-watchface \
            --es watchFaceId "$APPLICATION_ID"
          adb shell input keyevent KEYCODE_WAKEUP
          sleep 30
      - name: Capture preview
        run: |
          adb shell input keyevent KEYCODE_WAKEUP
          sleep 3
          adb exec-out screencap -p > preview_raw.png
      - name: Collect diagnostics
        if: always()
        run: |
          adb shell cmd package query-services -a android.support.wearable.complications.ACTION_COMPLICATION_UPDATE_REQUEST > complication-providers.txt || true
          adb logcat -d > logcat.txt || true
          adb shell ps -A > ps.txt || true
          mkdir -p apks
          for pkg in com.google.android.apps.wearable.systemui com.google.android.wearable.app com.google.android.clockwork.emulator.complication.datasource; do
            adb shell pm path "$pkg" | sed 's/^package://' | while read -r apk; do
              adb pull "$apk" "apks/${pkg}-$(basename "$apk")" || true
            done
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: emulator-log
          path: |
            emulator.log
            complication-providers.txt
            logcat.txt
            preview_raw.png
            ps.txt
            apks
      - name: Resize preview
        run: |
          convert preview_raw.png -resize 384x384 -strip app/src/main/res/drawable/tile_preview.png
          cp app/src/main/res/drawable/tile_preview.png app/src/main/res/drawable-round/tile_preview.png
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tile-preview
          path: app/src/main/res/drawable/tile_preview.png
      - name: Create pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- app/src/main/res; then
            echo "プレビュー画像に差分がないため終了"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -C "$PREVIEW_BRANCH"
          git add app/src/main/res/drawable/tile_preview.png app/src/main/res/drawable-round/tile_preview.png
          git commit -m "tile_preview.png を更新"
          git push --force origin "$PREVIEW_BRANCH"
          if [ -z "$(gh pr list --head "$PREVIEW_BRANCH" --base "$BASE_BRANCH" --state open --json number --jq '.[]')" ]; then
            gh pr create \
              --base "$BASE_BRANCH" \
              --head "$PREVIEW_BRANCH" \
              --title "tile_preview.png を更新 ($BASE_BRANCH)" \
              --body "Update Tile Preview workflow で $BASE_BRANCH のウォッチフェイスを撮影して更新しました。"
          fi
